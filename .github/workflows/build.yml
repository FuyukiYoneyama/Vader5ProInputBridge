name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 / Node 24
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0 / Node 24
        with:
          dotnet-version: 10.0.x
      - name: Audit public files and history
        shell: pwsh
        run: python tools/audit-publication.py
      - name: Build
        shell: pwsh
        run: ./build-apps.ps1
      - name: Package
        shell: pwsh
        run: ./package-release.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 / Node 24
        with:
          name: VADERBridge-windows-x64
          path: dist/*.zip*
          if-no-files-found: error
